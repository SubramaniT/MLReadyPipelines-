version: 2

models:
  - name: fastest_pit_stops_by_constructor
    description: "Use the puthon describe() method to retrieve summary statistic"
    columns:
      - name: constructor_name
        description: "team that makes the car"
        tests:
          - unique
  - name: lap_times_moving_avg
    description: "use the python .rolling() method to calculate the 5 year rolling average of pit stop"
    columns:
      - name: race_year
        description: year of the race
        tests:
          - relationships:
              to: ref('int_lap_times_years')
              field: race_year
              